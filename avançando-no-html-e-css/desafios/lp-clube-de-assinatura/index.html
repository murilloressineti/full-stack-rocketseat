<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encantos Literários</title>
  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hero-wrapper">
    <header class="top">
      <div class="logo">
        <img class="logo-desktop" src="assets/logo/logo-horizontal.svg" alt="Logo">
        <img class="logo-mobile" src="assets/logo/logo-symbol.svg" alt="Logo mobile">
      </div>
      <button><span>Assinar</span></button>
    </header>

    <section class="hero">
    <div class="hero-text">
      <h1>Desperte a sua imaginação e explore novos mundos</h1>
      <p>Junte-se ao clube de assinatura Encantos Literários e descubra maravilhas e aventuras a cada página</p>
    </div>
    </section>
  </div>

  <section class="hero-description">
      <img class="hero-book" src="assets/icons-hero/mystery-opened-spellbook.png" alt="Livro mágico">
      <p>
        Receba todo mês um <strong>livro surpresa</strong> do seu tema favorito, acompanhado de <strong>brindes exclusivos</strong> que tornarão a sua experiência literária <strong>encantadora</strong>.
      </p>
      <div class="hero-icons">
        <img class="icon-planchette" src="assets/icons-hero/mystery-ouija-planchette.png" alt="">
        <img class="icon-crystal" src="assets/icons-hero/mystery-crystal-ball.png" alt="">
      </div>
  </section>

</body>
</html>
