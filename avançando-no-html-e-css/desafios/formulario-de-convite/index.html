<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Convite</title>

    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside>
        <div class="aside-container">
          <header>
            <img
              src="assets/images/logo.svg"
              alt="Emoji de festa representando o logo do Festivite"
            />
            <div class="header-content">
              <h1>Festivite</h1>
              <p class="text-heading">
                Crie um convite digital para o seu evento
              </p>
            </div>
          </header>

          <img src="" alt="" />
        </div>
      </aside>
      <main>
        <div class="main-container">
          <h2>Crie seu convite</h2>

          <form action="" method="post">
            <fieldset class="about-the-event">
              <legend>
                <img
                  src="assets/icons/calendar.svg"
                  alt="Ícone de calendário"
                />Sobre o evento
              </legend>

              <div class="input-wrapper">
                <label for="title">Título</label>
                <input
                  type="text"
                  id="title"
                  name="title"
                  placeholder="Nome do evento"
                />
              </div>

              <div class="input-wrapper">
                <label for="start">Início</label>
                <input
                  type="datetime"
                  id="start"
                  name="start"
                  placeholder="DD/MM/AAAA, --:--"
                />
              </div>

              <div class="input-wrapper">
                <label for="end">Fim</label>
                <input
                  type="datetime"
                  id="end"
                  name="end"
                  placeholder="DD/MM/AAAA, --:--"
                />
              </div>

              <div class="input-wrapper modality">
                <label for="modality">Tipo</label>

                <div class="segmented-control">
                  <div class="option-container">
                    <img
                      src="assets/icons/building.svg"
                      alt="Ícone de prédio"
                    />
                    <label for="presencial">Presencial</label>
                    <input
                      type="radio"
                      name="modality"
                      id="presencial"
                      value="presencial"
                      checked
                    />
                  </div>

                  <div class="option-container">
                    <img src="assets/icons/video.svg" alt="Ícone de vídeo" />
                    <label for="online">Online</label>
                    <input
                      type="radio"
                      name="modality"
                      id="online"
                      value="online"
                    />
                  </div>
                </div>
              </div>

              <div class="input-wrapper">
                <label for="location">Local</label>
                <input
                  type="text"
                  id="location"
                  name="location"
                  placeholder="Link ou endereço"
                />
              </div>

              <div class="textarea-wrapper">
                <label for="description">Descrição</label>
                <textarea
                  name="description"
                  id="description"
                  cols="30"
                  rows="5"
                  placeholder="Escreva sobre os detalhes do evento"
                >
                </textarea>
              </div>
            </fieldset>

            <fieldset class="customization">
              <legend>
                <img
                  src="assets/icons/paintbrush-vertical.svg"
                  alt="Ícone de pincel"
                />
                Personalização
              </legend>

              <div class="input-wrapper">
                <label for="color">Cor principal</label>
                <div class="color-options">
                  <label class="color-option">
                    <input type="radio" name="color" id="color-1" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-2" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-3" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-4" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-5" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-6" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-7" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-8" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-9" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-10" />
                    <span class="color-circle"></span>
                  </label>

                  <label class="color-option">
                    <input type="radio" name="color" id="color-11" />
                    <span class="color-circle"></span>
                  </label>
                </div>
              </div>

              <div class="input-wrapper">
                <label for="theme">Tema do evento</label>
                <div class="cards">
                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-1"
                      value="birthday"
                    />
                    <label for="theme-1">
                      <img
                        src="assets/themes/image-1.png"
                        alt="Ícone de aniversário"
                      />
                      Aniversário
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-2"
                      value="kids"
                    />
                    <label for="theme-2">
                      <img
                        src="assets/themes/image-2.png"
                        alt="Ícone de infantil"
                      />
                      Infantil
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-3"
                      value="graduation"
                    />
                    <label for="theme-3">
                      <img
                        src="assets/themes/image-3.png"
                        alt="Ícone de formatura"
                      />
                      Formatura
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-4"
                      value="wedding"
                    />
                    <label for="theme-4">
                      <img
                        src="assets/themes/image-4.png"
                        alt="Ícone de casamento"
                      />
                      Casamento
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-5"
                      value="baby-shower"
                    />
                    <label for="theme-5">
                      <img
                        src="assets/themes/image-5.png"
                        alt="Ícone de chá de bebê"
                      />
                      Chá de bebê
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-6"
                      value="bridal-shower"
                    />
                    <label for="theme-6">
                      <img
                        src="assets/themes/image-6.png"
                        alt="Ícone de chá de panela"
                      />
                      Chá de panela
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-7"
                      value="carnival"
                    />
                    <label for="theme-7">
                      <img
                        src="assets/themes/image-7.png"
                        alt="Ícone de carnaval"
                      />
                      Carnaval
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-8"
                      value="easter"
                    />
                    <label for="theme-8">
                      <img
                        src="assets/themes/image-8.png"
                        alt="Ícone de páscoa"
                      />
                      Páscoa
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-9"
                      value="sao-joao"
                    />
                    <label for="theme-9">
                      <img
                        src="assets/themes/image-9.png"
                        alt="Ícone de São João"
                      />
                      São João
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-10"
                      value="halloween"
                    />
                    <label for="theme-10">
                      <img
                        src="assets/themes/image-10.png"
                        alt="Ícone de halloween"
                      />
                      Halloween
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-11"
                      value="christmas"
                    />
                    <label for="theme-11">
                      <img
                        src="assets/themes/image-11.png"
                        alt="Ícone de Natal"
                      />
                      Natal
                    </label>
                  </div>

                  <div class="card">
                    <input
                      type="radio"
                      name="theme"
                      id="theme-12"
                      value="other"
                    />
                    <label for="theme-12">
                      <img
                        src="assets/themes/image-12.png"
                        alt="Ícone de outro"
                      />
                      Outro
                    </label>
                  </div>
                </div>
              </div>

              <div class="input-wrapper">
                <label for="theme-toggle">Estilo</label>

                <div class="toggle">
                  <input type="checkbox" id="theme-toggle" />
                  <label for="theme-toggle" class="toggle-label">
                    <span class="toggle-slider"></span>
                  </label>
                  <span class="toggle-text">Escuro</span>
                </div>
              </div>

              <div class="file-input-wrapper">
                <label for="file-upload" class="custom-file-label">
                  <img
                    src="assets/icons/buttons/upload-secondary.svg"
                    alt="Ícone de upload"
                  />
                  Selecionar
                </label>
                <input type="file" id="file-upload" class="file-input" />
                <span id="file-name">Nenhum arquivo selecionado</span>
              </div>
            </fieldset>

            <fieldset class="contact">
              <legend>
                <img src="assets/icons/contact.svg" alt="Ícone de contato" />
                Dados para contato
              </legend>

              <div class="input-wrapper">
                <label for="name">Nome</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Nome completo"
                  required
                />
              </div>

              <div class="input-wrapper">
                <label for="mail">E-mail</label>
                <input
                  type="email"
                  id="mail"
                  name="mail"
                  placeholder="exemplo@email.com"
                  required
                />
              </div>

              <div class="input-wrapper">
                <label for="phone">Telefone</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="(99) 99999-9999 "
                  pattern="\(\d{2}\) \d{4,5}-\d{4}"
                  required
                />
              </div>
            </fieldset>

            <fieldset class="terms-and-conditions">
              <legend>
                <div>
                  <span>-</span>
                </div>
              </legend>

              <div class="checkbox-wrapper">
                <input type="checkbox" name="terms" id="terms" />
                <label for="terms">
                  Li e concordo com os <a href="#">Termos e Condições</a> e com
                  a <a href="#">Política de Privacidade</a>
                </label>
              </div>

              <div class="checkbox-wrapper">
                <input
                  type="checkbox"
                  id="email-updates"
                  name="email-updates"
                />
                <label for="email-updates">
                  Aceito receber atualizações e promoções por e-mail
                </label>
              </div>

              <div class="checkbox-wrapper">
                <input type="checkbox" id="sms-updates" name="sms-updates" />
                <label for="sms-updates">
                  Aceito receber atualizações e promoções por SMS
                </label>
              </div>

              <button type="submit" class="submit-button">
                <img src="assets/icons/ticket.svg" alt="Ícone de ingresso" />
                Gerar convite
              </button>
            </fieldset>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
