<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="src/assets/icon-petshop.svg" />

    <title>Agenda Petshop</title>
  </head>
  <body>
    <div class="container">
      <img src="./src/assets/logo.svg" alt="Logo" class="logo" />

      <div class="modal-overlay">
        <form class="form">
          <button class="close-button" aria-label="Fechar agendamento">
            <img src="./src/assets/close.svg" alt="Fechar" />
          </button>

          <header>
            <h1>Agende um atendimento</h1>
            <p>Preencha os dados do cliente para realizar o agendamento:</p>
          </header>

          <label for="client" class="label">Nome do tutor</label>
          <div class="input-wrapper">
            <i><img src="./src/assets/person.svg" alt="Calendário" /></i>
            <input
              type="text"
              id="client"
              name="client"
              placeholder="Nome do cliente"
              required
            />
          </div>

          <label for="client" class="label">Nome do pet</label>
          <div class="input-wrapper">
            <i><img src="./src/assets/pet.svg" alt="Calendário" /></i>
            <input
              type="text"
              id="pet"
              name="pet"
              placeholder="Cheddar"
              required
            />
          </div>

          <label for="client" class="label">Telefone</label>
          <div class="input-wrapper">
            <i><img src="./src/assets/phone.svg" alt="Calendário" /></i>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="(00) 0 0000-0000"
              pattern="[0-9]{10,11}"
              inputmode="numeric"
              title="Digite um número de telefone com DDD. Ex: 11912345678. Apenas números são necessários."
              minlength="11"
              maxlength="11"
              required
            />
          </div>

          <label for="client" class="label">Descrição do serviço</label>
          <div class="input-wrapper textarea">
            <textarea
              id="description"
              name="description"
              placeholder="Banho e tosa"
              required
            ></textarea>
          </div>

          <div class="date-time-section">
            <div class="date-wrapper">
              <label for="date" class="label">Data</label>
              <div class="input-wrapper">
                <i><img src="./src/assets/calendar.svg" alt="Calendário" /></i>
                <input type="date" id="date" name="date" required />
              </div>
            </div>

            <div class="time-wrapper">
              <span class="label">Hora</span>
              <div class="time-picker-container">
                <div
                  class="input-wrapper custom-time-input"
                  tabindex="0"
                  role="combobox"
                  aria-expanded="false"
                  aria-controls="hours"
                >
                  <i><img src="./src/assets/time.svg" alt="Hora" /></i>
                  <span id="display-time">--:--</span>
                  <i><img src="src/assets/arrow-down.svg" alt="" /></i>
                </div>
                <ul
                  id="hours"
                  class="hours"
                  aria-label="Horários disponíveis"
                  role="listbox"
                >
                  <!-- 
                  <li data-period="morning" class="hour-period">Manhã</li>
                  <li
                    data-period="morning"
                    value="09:00"
                    class="hour hour-available"
                    role="option"
                  >
                    09:00
                </li>
                  -->
                  <!-- 
                  <li data-period="afternoon" class="hour-period">Tarde</li>
                  <li
                    data-period="afternoon"
                    value="13:00"
                    class="hour hour-unavailable"
                    role="option"
                  >
                    13:00
                  </li>
                -->
                  <!-- 
                  <li data-period="night" class="hour-period">Noite</li>
                  <li
                    data-period="night"
                    value="19:00"
                    class="hour hour-available"
                    role="option"
                  >
                    19:00
                  </li>
                --></ul>
              </div>
            </div>
          </div>

          <div class="button-wrapper">
            <button type="submit" class="button">Agendar</button>
          </div>
        </form>
      </div>

      <aside class="schedule">
        <header>
          <div class="header-content">
            <h1>Sua agenda</h1>
            <p>
              Aqui você pode ver todos os clientes e serviços agendados para
              hoje.
            </p>
          </div>

          <div class="input-wrapper">
            <i><img src="./src/assets/calendar.svg" alt="Calendário" /></i>
            <label for="date" class="label"></label>
            <input
              type="date"
              id="date-schedule"
              name="date-schedule"
              required
            />
          </div>
        </header>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/morning.svg" alt="Manhã" />
            <strong>Manhã</strong>
            <span>09h-12h</span>
          </header>
          <ul id="period-morning" class="period">
            <!--
            <li>
              <strong>11:00</strong>
              <span><b>Thor</b> / Fernanda Costa</span>
              <span>Vacinação</span>
              <p>Remover agendamento</p>
            </li>
            -->
          </ul>
        </section>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/afternoon.svg" alt="Tarde" />
            <strong>Tarde</strong>
            <span>13h-18h</span>
          </header>
          <ul id="period-afternoon" class="period">
            <!--
            <li>
              <strong>13:00</strong>
              <span><b>Mel</b> / João Souza</span>
              <span>Corte de Unhas</span>
              <p>Remover agendamento</p>
            </li>
            -->

          </ul>
        </section>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/night.svg" alt="noite" />
            <strong>noite</strong>
            <span>19h-21h</span>
          </header>
          <ul id="period-night" class="period">
            <!--
            <li>
              <strong>19:00</strong>
              <span><b>Max</b> / Camila Santos</span>
              <span>Limpeza de Dentes</span>
              <p>Remover agendamento</p>
            </li>
            -->
          </ul>
        </section>
      </aside>
    </div>

    <footer>
      <button class="button-schedule">Novo agendamento</button>
    </footer>
  </body>
</html>
