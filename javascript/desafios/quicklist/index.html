<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quicklist - Lista de Compras</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <img src="assets/logo.svg" alt="Logo da Quicklist" />
      </header>

      <main>
        <a href="#" class="back"><- Voltar </a>
        <h1>Compras da semana</h1>

        <form id="form">
          <input
            type="text"
            id="item-input"
            placeholder="Adicione um novo item"
          />
          <button type="submit">Adicionar item</button>
        </form>

        <ul id="item-list">
          <li>
            <label class="item-wrapper">
              <input type="checkbox" class="custom-checkbox" />
              <span class="item-text">Pão de forma</span>
            </label>
            <button class="delete-btn">
              <img src="assets/icons/bin.svg" alt="ícone de lixeira" />
            </button>
          </li>

          <li>
            <label class="item-wrapper">
              <input type="checkbox" class="custom-checkbox" />
              <span class="item-text">Pão de forma</span>
            </label>
            <button class="delete-btn">
              <img src="assets/icons/bin.svg" alt="ícone de lixeira" />
            </button>
          </li>
        </ul>

        <div class="alert hidden" id="alert">
          <span>
            <img src="assets/icons/warning.svg" alt="Ícone de aviso" />
            O item foi removido da lista
          </span>
          <button id="close-alert">
            <img src="assets/icons/delete.svg" alt="Fechar alerta" />
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
